[package]
name = "rust-rcs-core"
version = "0.3.1"
edition = "2021"
description = "Core libraries that provide basic RCS capabilities (SIP, MSRP, etc.)"
license = "Apache-2.0"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]

name = "rust_rcs_core"
crate-type = ["rlib", "cdylib"]

[dependencies]

rust-strict-sdp = { version = "0.1" }

async-compression = { version = "0.4", features = ["futures-io", "brotli", "deflate", "gzip"] }
base64 = { version = "0.21" }
cached = { version = "0.46" }
chrono = { version = "0.4" }
cookie = { version = "0.18" }
data-encoding = { version = "2.5" }
futures = { version = "0.3" }
hickory-client = { version = "0.24", default-features = false }
httparse = { version = "1.8" }
libc = { version = "0.2" }
lzw = { version = "0.10" }
md-5 = { version = "0.10" }
quick-xml = { version = "0.31" }
rand = { version = "0.8" }
ring = { version = "0.17" }
rustls = { version = "0.22" }
tokio = { version = "1.35", features = ["rt-multi-thread", "io-util", "io-std", "net", "time", "macros", "sync"] }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7", features = ["compat"] }
url = { version = "2.5" }
uuid = { version = "1.6", features = ["v4"] }
walkdir = { version = "2.4" }

aes = { version = "0.8", optional = true }
ctr = { version = "0.9", optional = true }
der = { version = "0.7", features = ["alloc", "derive", "oid"], optional = true }
hkdf = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
openmls = { version = "0.9", optional = true }
openmls_basic_credential = { version = "0.6", optional = true, features = ["clonable"] }
openmls_rust_crypto = { version = "0.6", optional = true }
openmls_traits = { version = "0.6", optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
p384 = { version = "0.13", features = ["ecdsa"], optional = true }
p521 = { version = "0.13", features = ["ecdsa"], optional = true }
prost = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
spki = { version = "0.7", optional = true }
tls_codec = { version = "0.5", features = ["derive"], optional = true }
x509-cert = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1.35", features = ["test-util"] }
serde_json = "1"

[features]
default = []
android = []
ohos = []
# MLS (RFC 9420) based end-to-end encryption, required by RCS Universal Profile 3.0.
# Pulls in OpenMLS, which needs rustc 1.91 or newer.
e2ee = [
    "dep:aes",
    "dep:ctr",
    "dep:der",
    "dep:hkdf",
    "dep:hmac",
    "dep:openmls",
    "dep:openmls_basic_credential",
    "dep:openmls_rust_crypto",
    "dep:openmls_traits",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:prost",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:tls_codec",
    "dep:x509-cert",
]

# OpenMLS with SelfRemove under the proposal type RCC.16 gives self_remove,
# see vendor/openmls/VENDORED.md
[patch.crates-io]
openmls = { path = "vendor/openmls" }
